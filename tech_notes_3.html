<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technical Notes</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            background-color: transparent;
            color: white;
        }
        header {
            background: transparent;
            color: #fff;
            padding: 10px 15px;
            text-align: center;
        }
        main {
            padding: 20px;
            max-width: 800px;
            margin: auto;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            margin: 10px 0;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }
        li:nth-child(even) {
            background: rgba(255, 255, 255, 0.08);
        }
        a {
            text-decoration: none;
            color: white;
        }
        a span.prefix {
            color: #7ac2df;
            font-weight: bold;
        }
        a span.suffix {
            color: #a8d8eb;
            text-decoration: underline;
        }
        a:hover span.prefix,
        a:hover span.suffix {
            text-decoration: underline;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <main>
        <ul id="notesList">
            <li><a href="https://github.com/a1anw0ng/a1anw0ng.github.io/blob/main/tech_notes/networking_notes.txt" target="_blank"><span class="prefix">Linux Commands --</span> <span class="suffix">Network Notes</span></a></li>
